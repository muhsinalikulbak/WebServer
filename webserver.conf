server {
    listen 127.0.0.1:8080;



    server_name example.com;
    client_max_body_size 10M;

    error_page 404 www/errors/404.html;
    error_page 500 www/errors/500.html;
    error_page 400 www/errors/400.html;
    error_page 405 www/errors/405.html;
    error_page 413 www/errors/413.html;
    error_page 431 www/errors/431.html;
    error_page 501 www/errors/501.html;
    error_page 505 www/errors/505.html;

    location / {
        allow_methods GET POST;
        root www;
        index index.html;
        autoindex on;
        cgi_ext .bla ./cgi_tester;
    }

    location /upload {
        allow_methods POST DELETE;
        root www/uploads/files;
        upload_enable on;
        upload_store www/uploads/files;
    }

    location /cgi-bin {
        allow_methods GET POST;
        root www/cgi-bin;
        cgi_ext .py /usr/bin/python3;
        cgi_ext .php /usr/bin/php-cgi;
    }

    location /old-path {
        return 301 https://example.com/new-path;
    }

    location /post_body {
        client_max_body_size 100;
        allow_methods GET POST;
        root www;
        index index.html;
    }

    location /directory {
        client_max_body_size 100M;
        allow_methods GET POST;
        root www;
        index index.html;
    }
}

server {
    listen 0.0.0.0:8080;
    server_name test.com;
    client_max_body_size 2M;

    location / {
        allow_methods GET;
        root www;
        index default.html;
        autoindex off;
    }
}
